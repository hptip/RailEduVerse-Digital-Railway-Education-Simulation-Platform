# Nginx cho bản Web UTTVR (build Gzip, Decompression Fallback tắt).
# Thay TEN_MIEN bằng tên miền thật, /var/www/uttvr bằng thư mục chứa bản build (thư mục có index.html).
# Chứng chỉ HTTPS: sudo certbot --nginx -d TEN_MIEN

server {
    listen 80;
    server_name TEN_MIEN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name TEN_MIEN;

    # certbot tự điền 2 dòng này
    # ssl_certificate     /etc/letsencrypt/live/TEN_MIEN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TEN_MIEN/privkey.pem;

    root  /var/www/uttvr;
    index index.html;

    sendfile   on;
    tcp_nopush on;
    client_max_body_size 20m;

    # Trang chính: luôn hỏi lại máy chủ để nhận bản build mới ngay sau khi cập nhật
    location = /index.html { add_header Cache-Control "no-cache"; }

    # File đã nén sẵn bằng Gzip: báo trình duyệt tự giải nén, không nén lần hai
    location ~ .+\.(data|symbols\.json)\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "no-cache";
        default_type application/octet-stream;
    }
    location ~ .+\.js\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }
    location ~ .+\.wasm\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "no-cache";
        default_type application/wasm;
    }

    # Dữ liệu đi kèm (SQLite, slide…): cho phép hỏi lại bằng ETag (trả 304 nếu không đổi)
    location /StreamingAssets/ { add_header Cache-Control "no-cache"; }

    # Máy chủ tài khoản / điểm (Flask) chạy cùng máy, cùng tên miền -> DataBridge dùng "/api" không cần sửa
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Trang quản trị: chỉ cho mạng nội bộ (sửa dải IP cho đúng), hoặc thay bằng mật khẩu auth_basic
    location /admin {
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://127.0.0.1:5000;
    }
}
